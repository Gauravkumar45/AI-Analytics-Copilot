name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run the 40-question LLM eval (needs the GROQ_API_KEY secret)"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  eval:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/seed_demo_db.py
      - run: python -m evals.run_eval --out evals/results --min-accuracy 0.6
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: evals/results }
      - run: cat evals/results/report.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
